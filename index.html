<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Capela das Duas Prisões — Mesa do Mestre</title>
<meta name="description" content="Site de mesa para a aventura A Capela das Duas Prisões (D&D 3.5): história completa, mapas, puzzles, pistas, fichas de vilões e um modo só para os jogadores.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23171209'/%3E%3Cpath d='M5 20V9l7-5 7 5v11z' fill='none' stroke='%23c9a227' stroke-width='1.6'/%3E%3Cpath d='M11 20v-5h2v5' fill='none' stroke='%23c9a227' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-role="player">

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-crest" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M8 42V16L24 5l16 11v26z" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M18 42V30a6 6 0 0 1 12 0v12" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M24 5v6" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="24" cy="18" r="2.6" fill="currentColor"/>
      </svg>
      <div>
        <h1>A Capela das<br>Duas Prisões</h1>
        <p>D&amp;D 3.5 · Valebruma</p>
      </div>
    </div>

    <button class="menu-toggle" id="menu-toggle" type="button" data-action="menu-toggle"
      aria-label="Abrir menu" aria-controls="mobile-menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </svg>
    </button>

    <div class="sidebar-menu" id="mobile-menu">
      <div class="role-switch" role="group" aria-label="Modo de visualização">
        <button class="role-btn gm" data-action="role-gm" title="Ver segredos, fichas e finais (pede senha)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-4 7.5-8 9-4-1.5-8-4-8-9V6z"/></svg>
          Mestre
        </button>
        <button class="role-btn player" data-action="role-player" title="Esconder tudo que é segredo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
          Jogadores
        </button>
      </div>

      <nav class="nav" id="nav" aria-label="Navegação principal"></nav>

      <div class="sidebar-foot">
        <div class="rule"><i></i></div>
        <div class="save-row"><span class="dot"></span><span>Salvo neste navegador</span></div>
        <div class="foot-actions">
          <button class="btn btn-ghost btn-sm" data-action="export">Exportar</button>
          <button class="btn btn-ghost btn-sm" data-action="import">Importar</button>
          <button class="btn btn-ghost btn-sm" data-action="print">Imprimir</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <span class="eyebrow" id="top-eyebrow">Modo jogador</span>
        <h2 id="top-title">Início</h2>
      </div>
      <div class="topbar-right">
        <span class="role-badge player" id="role-badge">JOGADORES</span>
        <div class="session-clock" id="session-clock" title="Tempo de sessão — duplo clique zera">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span id="clock-text">00:00</span>
          <button class="icon-btn" data-action="clock-toggle" title="Iniciar/pausar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div id="view" class="view"></div>

    <footer class="foot-note">
      <span class="rule"><i></i></span>
      <p>A Capela das Duas Prisões · material de mesa · ajuste os números às fichas do seu grupo</p>
    </footer>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/tools.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
